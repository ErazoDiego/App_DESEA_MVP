schema: spec-driven

context: |
  Tech stack: Flutter 3.41.9, Dart 3.11.5, Riverpod, GoRouter, Hive CE
  Architecture: Clean Architecture (domain/data/presentation), Repository pattern, Riverpod Notifier
  Testing: flutter_test (332 tests, all pass), in-memory Hive fakes
  Style: flutter_lints v5, dart format, Spanish docstrings, immutable state with copyWith

strict_tdd: true

testing:
  command: flutter test
  coverage: flutter test --coverage
  framework: flutter_test
  layers:
    unit: flutter_test
    integration: null
    e2e: null
  quality:
    linter: flutter analyze
    type_checker: dart analyze
    formatter: dart format

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    - Maintain existing Riverpod provider patterns
    - Generate Hive adapters with build_runner when models change
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
    - Verify no regressions with `flutter test`
  archive:
    - Warn before merging destructive deltas (large removals)
    - Maintain Given/When/Then format in main specs
